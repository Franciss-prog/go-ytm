version: "2"

run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - forbidigo
    - gocritic
    - misspell
    - noctx
    - revive
    - unconvert
    - depguard
  settings:
    forbidigo:
      forbid:
        # Raw colors belong in internal/theme (palettes) and internal/style only.
        - pattern: ^lipgloss\.Color$
          msg: use semantic theme tokens via internal/style
        - pattern: ^fmt\.Print(f|ln)?$
          msg: write to the command's IO streams, not os.Stdout
      analyze-types: true
    depguard:
      rules:
        charm-v2-only:
          deny:
            - pkg: github.com/charmbracelet/bubbletea
              desc: use charm.land/bubbletea/v2
            - pkg: github.com/charmbracelet/lipgloss
              desc: use charm.land/lipgloss/v2
            - pkg: github.com/charmbracelet/bubbles
              desc: use charm.land/bubbles/v2
            - pkg: github.com/charmbracelet/huh
              desc: use charm.land/huh/v2
            - pkg: github.com/mattn/go-sqlite3
              desc: cgo; use modernc.org/sqlite
    revive:
      rules:
        - name: exported
        - name: package-comments
    gocritic:
      enabled-tags: [diagnostic]
  exclusions:
    presets: [std-error-handling]
    rules:
      - path: internal/(theme|style)/
        linters: [forbidigo]
        text: lipgloss\.Color
      - path: _test\.go
        linters: [forbidigo, noctx]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/Franciss-Prog/go-ytm]
